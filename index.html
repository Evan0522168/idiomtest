<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>成語學習助手 (Flashcard & Quiz)</title>

  <style>
    :root {
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
    }

    h1, h2, h3 {
      text-align: center;
      margin-bottom: 20px;
      color: #0f172a;
    }

    .container {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      margin-bottom: 20px;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 2px solid var(--border);
      padding-bottom: 10px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px 16px;
      border: none;
      background: none;
      font-size: 16px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--primary);
      color: white;
    }

    textarea {
      width: 100%;
      height: 120px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      resize: vertical;
      margin-bottom: 12px;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-success { background: var(--success); color: white; }
    .btn-warning { background: var(--warning); color: white; }
    .btn-danger { background: var(--danger); color: white; }

    /* Flashcard Styles */
    .flashcard {
      min-height: 200px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      text-align: center;
      background: #fafafa;
    }

    .idiom-title {
      font-size: 32px;
      font-weight: bold;
      letter-spacing: 2px;
      margin-bottom: 15px;
      color: #0f172a;
    }

    .idiom-meaning {
      font-size: 18px;
      color: #334155;
      background: #eff6ff;
      padding: 12px 16px;
      border-radius: 8px;
      border-left: 4px solid var(--primary);
      width: 100%;
      text-align: left;
      display: none;
      margin-top: 10px;
    }

    .flashcard-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .progress {
      text-align: center;
      font-weight: bold;
      color: var(--text-muted);
      margin-bottom: 15px;
    }

    /* Quiz Styles */
    .quiz-setup {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }

    .quiz-setup select {
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-size: 15px;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-top: 20px;
    }

    .option-btn {
      padding: 14px 18px;
      border: 1px solid var(--border);
      background: white;
      border-radius: 8px;
      text-align: left;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--primary);
      background: #f0f7ff;
    }

    .option-btn.correct {
      background: #d1fae5 !important;
      border-color: var(--success) !important;
      color: #065f46;
      font-weight: bold;
    }

    .option-btn.wrong {
      background: #fee2e2 !important;
      border-color: var(--danger) !important;
      color: #991b1b;
    }

    .hidden { display: none !important; }

    .result-box {
      text-align: center;
      padding: 20px;
    }

    .result-box textarea {
      margin-top: 15px;
      height: 150px;
    }
  </style>
</head>
<body>

  <h1>成語學習助手</h1>

  <div class="container">
    <h3>1. 輸入當次複習清單</h3>
    <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 8px;">請輸入要練習的成語（用換行或空格分開），預設已為您載入完整資料庫：</p>
    <textarea id="listInput" placeholder="請在此輸入成語清單..."></textarea>
    <button class="btn btn-primary" style="width: 100%;" onclick="loadList()">載入/更新當次清單</button>
  </div>

  <div class="container">
    <div class="tabs">
      <button class="tab-btn active" onclick="switchMode('flashcard')">Flashcard 模式</button>
      <button class="tab-btn" onclick="switchMode('quiz')">Quiz 測驗模式</button>
    </div>

    <!-- FLASHCARD MODE -->
    <div id="flashcardMode">
      <div id="fcContent">
        <div class="progress" id="fcProgress">進度：0 / 0</div>
        <div class="flashcard">
          <div class="idiom-title" id="fcTitle">請先載入清單</div>
          <div class="idiom-meaning" id="fcMeaning"></div>
        </div>
        <div class="flashcard-actions">
          <button class="btn btn-success" onclick="handleFCAnswer('know')">會了</button>
          <button class="btn btn-warning" onclick="handleFCAnswer('impression')">有印象</button>
          <button class="btn btn-danger" onclick="handleFCAnswer('forgot')">忘記了</button>
        </div>
      </div>

      <div id="fcResult" class="result-box hidden">
        <h2>🎉 本次 Flashcard 練習完成！</h2>
        <p>以下是您選擇「有印象」與「忘記了」的成語清單（已為您移除「會了」）：</p>
        <textarea id="fcResultOutput" readonly></textarea>
        <button class="btn btn-primary" onclick="copyResult()">一鍵複製新清單</button>
        <button class="btn btn-warning" onclick="restartFC()">重新練習本次清單</button>
      </div>
    </div>

    <!-- QUIZ MODE -->
    <div id="quizMode" class="hidden">
      <div id="quizSetupArea" class="quiz-setup">
        <label for="quizCount">選擇測驗題數：</label>
        <select id="quizCount">
          <option value="10">10 題</option>
          <option value="20">20 題</option>
          <option value="30">30 題</option>
          <option value="50">50 題</option>
          <option value="100">100 題</option>
          <option value="all">全部</option>
        </select>
        <button class="btn btn-primary" onclick="startQuiz()">開始測驗</button>
      </div>

      <div id="quizContent" class="hidden">
        <div class="progress" id="quizProgress">題目：0 / 0</div>
        <div class="flashcard" style="min-height: 120px;">
          <div class="idiom-title" id="quizTitle" style="margin-bottom: 0;">--</div>
        </div>
        <p style="font-size: 14px; color: var(--text-muted);">請選擇正確的成語解釋：</p>
        <div class="options-grid" id="quizOptions"></div>
        <div style="text-align: right; margin-top: 15px;">
          <button id="nextQuizBtn" class="btn btn-primary hidden" onclick="nextQuizQuestion()">下一題</button>
        </div>
      </div>

      <div id="quizResult" class="result-box hidden">
        <h2>📊 測驗結束！</h2>
        <p id="quizScoreText" style="font-size: 20px; font-weight: bold; margin: 15px 0;"></p>
        <button class="btn btn-primary" onclick="resetQuiz()">再測驗一次</button>
      </div>
    </div>
  </div>

  <script>
    // 內建完整成語資料庫

    document.getElementById('listInput').value = Object.keys(idiomDatabase).join('\n');

    // 全域狀態
    let currentList = [];
    let fcIndex = 0;
    let fcResultList = []; // 包含「有印象」和「忘記了」

    let quizList = [];
    let quizIndex = 0;
    let quizScore = 0;
    let quizTotal = 0;

    // 解析文字框中的成語清單
    function parseInputList() {
      const rawText = document.getElementById('listInput').value;
      const tokens = rawText.split(/[\n,，\s]+/);
      const list = [];
      tokens.forEach(t => {
        const cleaned = t.trim();
        if (cleaned && idiomDatabase[cleaned]) {
          if (!list.includes(cleaned)) list.push(cleaned);
        }
      });
      return list;
    }

    function loadList() {
      currentList = parseInputList();
      if (currentList.length === 0) {
        alert("請輸入有效的成語清單（需包含在預設成語庫中）！");
        return;
      }
      alert(`成功載入 ${currentList.length} 個成語！`);
      initFC();
      resetQuiz();
    }

    function switchMode(mode) {
      const fcBtn = document.querySelectorAll('.tab-btn')[0];
      const quizBtn = document.querySelectorAll('.tab-btn')[1];
      const fcMode = document.getElementById('flashcardMode');
      const quizMode = document.getElementById('quizMode');

      if (mode === 'flashcard') {
        fcBtn.classList.add('active');
        quizBtn.classList.remove('active');
        fcMode.classList.remove('hidden');
        quizMode.classList.add('hidden');
      } else {
        quizBtn.classList.add('active');
        fcBtn.classList.remove('active');
        quizMode.classList.remove('hidden');
        fcMode.classList.add('hidden');
      }
    }

    /* --- FLASHCARD LOGIC --- */
    function initFC() {
      if (currentList.length === 0) currentList = parseInputList();
      fcIndex = 0;
      fcResultList = [];
      document.getElementById('fcContent').classList.remove('hidden');
      document.getElementById('fcResult').classList.add('hidden');
      showFCCard();
    }

    function showFCCard() {
      if (fcIndex >= currentList.length) {
        // 完成 Flashcard
        document.getElementById('fcContent').classList.add('hidden');
        document.getElementById('fcResult').classList.remove('hidden');
        document.getElementById('fcResultOutput').value = fcResultList.join('\n');
        return;
      }

      const idiom = currentList[fcIndex];
      document.getElementById('fcProgress').innerText = `進度：${fcIndex + 1} / ${currentList.length}`;
      document.getElementById('fcTitle').innerText = idiom;
      const meaningEl = document.getElementById('fcMeaning');
      meaningEl.innerText = idiomDatabase[idiom] || "暫無解釋";
      meaningEl.style.display = "none";
    }

    function handleFCAnswer(type) {
      if (currentList.length === 0) return;
      const idiom = currentList[fcIndex];
      const meaningEl = document.getElementById('fcMeaning');

      if (type === 'know') {
        fcIndex++;
        showFCCard();
      } else {
        // 有印象或忘記了 -> 顯示解釋
        if (meaningEl.style.display === "block") {
          // 第二次點擊，進入下一張
          if (!fcResultList.includes(idiom)) {
            fcResultList.push(idiom);
          }
          fcIndex++;
          showFCCard();
        } else {
          // 第一次點擊，顯示正確意思
          meaningEl.style.display = "block";
          if (!fcResultList.includes(idiom)) {
            fcResultList.push(idiom);
          }
        }
      }
    }

    function restartFC() {
      initFC();
    }

    function copyResult() {
      const txt = document.getElementById('fcResultOutput');
      txt.select();
      document.execCommand('copy');
      alert("新清單已複製至剪貼簿！");
    }

    /* --- QUIZ LOGIC --- */
    function startQuiz() {
      if (currentList.length === 0) currentList = parseInputList();
      if (currentList.length < 4) {
        alert("成語數量不足 4 個，無法進行選擇題測驗！");
        return;
      }

      const countVal = document.getElementById('quizCount').value;
      let count = countVal === 'all' ? currentList.length : parseInt(countVal);
      count = Math.min(count, currentList.length);

      // 隨機抽題（洗牌）
      quizList = [...currentList].sort(() => Math.random() - 0.5).slice(0, count);
      quizIndex = 0;
      quizScore = 0;
      quizTotal = quizList.length;

      document.getElementById('quizSetupArea').classList.add('hidden');
      document.getElementById('quizContent').classList.remove('hidden');
      document.getElementById('quizResult').classList.add('hidden');

      showQuizQuestion();
    }

    function showQuizQuestion() {
      if (quizIndex >= quizTotal) {
        // 顯示結果
        document.getElementById('quizContent').classList.add('hidden');
        document.getElementById('quizResult').classList.remove('hidden');
        document.getElementById('quizScoreText').innerText = `您的得分：${quizScore} / ${quizTotal} 題 (${Math.round(quizScore/quizTotal*100)}分)`;
        return;
      }

      document.getElementById('nextQuizBtn').classList.add('hidden');
      document.getElementById('quizProgress').innerText = `題目：${quizIndex + 1} / ${quizTotal}`;
      
      const currentIdiom = quizList[quizIndex];
      document.getElementById('quizTitle').innerText = currentIdiom;

      // 產生 4 個選項（1 正確 + 3 隨機干擾）
      const correctMeaning = idiomDatabase[currentIdiom];
      const otherIdioms = Object.keys(idiomDatabase).filter(item => item !== currentIdiom);
      
      // 洗牌抽取 3 個干擾選項
      const wrongOptions = otherIdioms.sort(() => Math.random() - 0.5).slice(0, 3).map(key => idiomDatabase[key]);
      
      const options = [
        { text: correctMeaning, isCorrect: true },
        { text: wrongOptions[0], isCorrect: false },
        { text: wrongOptions[1], isCorrect: false },
        { text: wrongOptions[2], isCorrect: false }
      ].sort(() => Math.random() - 0.5);

      const optionsGrid = document.getElementById('quizOptions');
      optionsGrid.innerHTML = '';

      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt.text;
        btn.onclick = () => checkQuizAnswer(btn, opt.isCorrect, correctMeaning);
        optionsGrid.appendChild(btn);
      });
    }

    function checkQuizAnswer(selectedBtn, isCorrect, correctMeaning) {
      const buttons = document.querySelectorAll('#quizOptions .option-btn');
      buttons.forEach(btn => {
        btn.disabled = true;
        if (btn.innerText === correctMeaning) {
          btn.classList.add('correct');
        }
      });

      if (isCorrect) {
        quizScore++;
      } else {
        selectedBtn.classList.add('wrong');
      }

      document.getElementById('nextQuizBtn').classList.remove('hidden');
    }

    function nextQuizQuestion() {
      quizIndex++;
      showQuizQuestion();
    }

    function resetQuiz() {
      document.getElementById('quizSetupArea').classList.remove('hidden');
      document.getElementById('quizContent').classList.add('hidden');
      document.getElementById('quizResult').classList.add('hidden');
    }

    // 初始化頁面
    window.onload = function() {
      loadList();
    };
  </script>
</body>
</html>
